[package]
name = "neofand"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Per-component fan daemon for MacPro7,1 / T2 Macs (fork of T2FanRD)"
repository = "https://github.com/akhilv1/neofand"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
glob = { version = "0.3.1", default-features = false }
libc = { version = "0.2.149", default-features = false }
nonempty = { version = "0.10.0", default-features = false }
rust-ini = { version = "0.21.0", default-features = false }
thiserror = { version = "1.0.50", default-features = false }
signal-hook = { version = "0.3.17", default-features = false }
arraydeque = "0.5.1"
# Runtime-loaded (libloading) — no build-time NVIDIA dependency, and absent
# libnvidia-ml.so is a handled error rather than a link failure.
nvml-wrapper = { version = "0.10", optional = true }
# The safe wrapper exposes no fan setters (only `num_fans`), so the writes go
# through the raw bindings it already depends on. Reads and device handles still
# come from the safe wrapper.
nvml-wrapper-sys = { version = "0.8", optional = true }

[features]
default = ["nvidia"]
nvidia = ["nvml-wrapper", "nvml-wrapper-sys"]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
